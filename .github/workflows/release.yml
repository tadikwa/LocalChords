# Builds LocalChords on Windows for a tag v*, and attaches the two programs and the LGPL sources to a
# DRAFT release. Nothing is published until a maintainer has run the self-test on a real PC (the
# runners have no sound card) and published the draft by hand. An existing release is never touched.
name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write   # the draft release only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false

      # Rebuilds PyAV against the LGPL FFmpeg; localchords.spec refuses any other.
      - name: Build
        shell: pwsh
        run: scripts\build.ps1

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory out | Out-Null
          Copy-Item dist\onefile\LocalChords.exe "out\LocalChords-$env:VERSION-portable.exe"
          .venv\Scripts\python.exe -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'dist', 'LocalChords')" "out\LocalChords-$env:VERSION-windows-x64"
          .venv\Scripts\python.exe scripts\build_av_lgpl.py --sources "out\LocalChords-$env:VERSION-sources-tierces.zip"
          Get-ChildItem out | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Tee-Object out\SHA256SUMS.txt

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:VERSION *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "La publication $env:VERSION existe déjà : rien n'est remplacé. Empreintes ci-dessus."
            exit 0
          }
          gh release create $env:VERSION --draft --verify-tag --title "LocalChords $env:VERSION" --notes-file out\SHA256SUMS.txt (Get-ChildItem out).FullName
