[project]
name = "localchords"
version = "1.5"
description = "Grille d'accords locale et synchronisée pour Windows."
requires-python = ">=3.12,<3.13"
dependencies = [
  # Private functions of 0.3.1 are used (engines.py), hence the exact pin.
  "chordotomy[model]==0.3.1",
  "PySide6-Essentials>=6.8,<7",
  "av>=14",
  "sounddevice>=0.5",
  "yt-dlp",
  "yt-dlp-ejs",
  "numpy",
  # Runs the nets in the packaged program, without torch (onnx_engine.py).
  "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6", "mir_eval>=0.8", "pooch>=1.8", "onnx>=1.17", "onnxscript"]

[project.gui-scripts]
localchords = "localchords.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localchords"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/localchords/ui/theme.py" = ["E501"]  # the style sheet reads better unwrapped
"scripts/*" = ["E501", "F841", "SIM105", "SIM115"]
"tests/test_lyrics_ui.py" = ["F811"]  # reuses the fixtures of test_ui
"tests/test_lyrics_suggest.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]
markers = ["slow: runs the real engines (seconds per test)", "device: needs a real audio output"]
